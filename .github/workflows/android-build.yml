name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
    
    - name: Download Android SDK command-line tools
      run: |
        mkdir -p $HOME/android-sdk/cmdline-tools
        cd $HOME/android-sdk/cmdline-tools
        curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
        unzip -q cmdline-tools.zip
        mv cmdline-tools latest
        rm cmdline-tools.zip
        ls -la latest/bin/
    
    - name: Install Android SDK components
      env:
        ANDROID_HOME: $HOME/android-sdk
        ANDROID_SDK_ROOT: $HOME/android-sdk
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
        
        echo "=== Accepting licenses ==="
        yes | sdkmanager --licenses 2>&1 | tail -5
        
        echo "=== Installing SDK components ==="
        sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" --sdk_root=$ANDROID_HOME 2>&1 | tail -20
        
        echo "=== Verifying installation ==="
        ls $ANDROID_HOME/
        ls $ANDROID_HOME/build-tools/ 2>/dev/null || echo "NO BUILD-TOOLS"
        ls $ANDROID_HOME/platforms/ 2>/dev/null || echo "NO PLATFORMS"
    
    - name: Create local.properties
      working-directory: frontend/android-app
      env:
        ANDROID_HOME: $HOME/android-sdk
        ANDROID_SDK_ROOT: $HOME/android-sdk
      run: |
        echo "sdk.dir=$HOME/android-sdk" > local.properties
        echo "android.sdk.root=$HOME/android-sdk" >> local.properties
        cat local.properties
    
    - name: Generate Gradle wrapper
      working-directory: frontend/android-app
      run: |
        gradle wrapper --gradle-version=8.5
        ls -la gradlew
        chmod +x gradlew
    
    - name: Build Debug APK
      working-directory: frontend/android-app
      env:
        ANDROID_HOME: $HOME/android-sdk
        ANDROID_SDK_ROOT: $HOME/android-sdk
        JAVA_HOME: ${{ steps.jdk.outputs.path }}
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        
        echo "=== Environment ==="
        echo "JAVA_HOME=$JAVA_HOME"
        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
        which aapt || echo "aapt NOT FOUND"
        which dx || echo "dx NOT FOUND"
        
        echo "=== Running Gradle ==="
        ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -80
    
    - name: Build Release APK
      if: always()
      working-directory: frontend/android-app
      env:
        ANDROID_HOME: $HOME/android-sdk
        ANDROID_SDK_ROOT: $HOME/android-sdk
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        ./gradlew assembleRelease --no-daemon 2>&1 | tail -30
    
    - name: Upload Debug APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: frontend/android-app/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: ignore
    
    - name: Upload Release APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: frontend/android-app/app/build/outputs/apk/release/app-release.apk
        if-no-files-found: ignore
